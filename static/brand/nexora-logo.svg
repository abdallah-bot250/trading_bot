<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Nexora AI Trader logo</title>
  <desc id="desc">A premium dark technology logo with a green and cyan orbital N mark.</desc>
  <defs>
    <linearGradient id="markGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20D68A"/>
      <stop offset="0.55" stop-color="#34D3FF"/>
      <stop offset="1" stop-color="#9F8CFF"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#B9C7DA"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.125 0 0 0 0 0.839 0 0 0 0 0.541 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="720" height="180" rx="28" fill="#05070D"/>
  <g transform="translate(42 34)" filter="url(#glow)">
    <path d="M24 92V20h25l58 76V20h26v112h-25L50 57v75H24Z" fill="url(#markGradient)"/>
    <path d="M19 25C44 1 90-4 120 16" fill="none" stroke="#34D3FF" stroke-width="7" stroke-linecap="round"/>
    <path d="M138 107c-27 26-78 31-111 7" fill="none" stroke="#20D68A" stroke-width="7" stroke-linecap="round"/>
    <circle cx="18" cy="26" r="8" fill="#20D68A"/>
    <circle cx="139" cy="106" r="8" fill="#34D3FF"/>
  </g>
  <g transform="translate(210 58)">
    <text x="0" y="42" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#textGradient)">Nexora</text>
    <text x="0" y="82" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2" fill="#20D68A">AI TRADER</text>
  </g>
</svg>
