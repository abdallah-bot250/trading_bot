<!DOCTYPE html>
<html lang="{{ current_lang }}" dir="{{ direction }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الحساب - Nexora AI Trader</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a, #111827);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .verify-box {
            width: 100%;
            max-width: 450px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 22px;
            padding: 35px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            color: #22c55e;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.8;
            font-size: 15px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            border-radius: 14px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.25s;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.25);
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .note {
            margin-top: 20px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.9;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .verify-box {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .sub {
                font-size: 14px;
            }
        }
    </style>
<link rel="stylesheet" href="/static/premium.css?v=final-sale-4">
<link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="theme-color" content="#20D68A">

<script>
(function(){
  try {
    var saved = localStorage.getItem("nexora-theme") || "dark";
    document.documentElement.setAttribute("data-theme", saved);
  } catch(e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
</head>
<body>
<div class="language-switcher" aria-label="Language switcher">
    <a class="{% if current_lang == 'en' %}active{% endif %}" href="{{ language_url('en') }}">English</a>
    <a class="{% if current_lang == 'ar' %}active{% endif %}" href="{{ language_url('ar') }}">العربية</a>
</div>

<nav class="premium-floating-nav" aria-label="Quick navigation"><a href="/">الرئيسية</a><a href="/proof">الإثباتات</a><a href="/bot-check">فحص البوت</a><a href="/dashboard">الداشبورد</a></nav>

    <div class="verify-box">
        <div class="logo">🔐</div>
        <h1>تفعيل الحساب</h1>
        <div class="sub">
            أدخل كود التفعيل الخاص بك لإكمال ربط الحساب
            وتفعيل الوصول إلى النظام.
        </div>

        <form method="POST">
            {{ csrf_field() }}
            <label for="code">كود التفعيل</label>
            <input type="text" id="code" name="code" placeholder="أدخل كود التفعيل هنا" required>
            <button type="submit">تفعيل الآن</button>
        </form>

        <div class="note">
            📌 إذا لم يكن لديك كود تفعيل بعد، تأكد من إتمام التسجيل أو الدفع أولاً.
        </div>

        <div class="footer">
            Nexora AI Trader ©
        </div>
    </div>


<script>
window.NEXORA_LANG = "{{ current_lang }}";
</script>
<script src="/static/i18n.js?v=20260714_lang5"></script>

<script src="/static/nexora-ui.js?v=final-sale-4"></script>
</body>
</html>
