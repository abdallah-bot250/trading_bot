<!DOCTYPE html>
<html lang="{{ current_lang }}" dir="{{ direction }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#07110f; color:#f8fafc; font-family:Segoe UI, Arial, sans-serif; }
.box { width:min(420px, calc(100% - 28px)); background:#0d1b18; border:1px solid rgba(148,163,184,.2); border-radius:8px; padding:24px; }
h1 { margin:0 0 10px; font-size:24px; }
p { color:#9aa8b4; line-height:1.6; }
label { display:block; margin:16px 0 7px; color:#cbd5e1; }
input { width:100%; box-sizing:border-box; border:1px solid rgba(148,163,184,.3); background:#07110f; color:#fff; border-radius:8px; padding:12px; }
button { width:100%; margin-top:16px; border:0; border-radius:8px; padding:12px; background:#23c483; color:#03110d; font-weight:800; cursor:pointer; }
a { color:#38bdf8; text-decoration:none; }
.flash { margin:10px 0; color:#fecaca; }
</style>
<link rel="stylesheet" href="/static/premium.css">
<link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="theme-color" content="#20D68A">

<body>
<div class="language-switcher" aria-label="Language switcher">
    <a class="{% if current_lang == 'en' %}active{% endif %}" href="{{ language_url('en') }}">English</a>
    <a class="{% if current_lang == 'ar' %}active{% endif %}" href="{{ language_url('ar') }}">العربية</a>
</div>

<nav class="premium-floating-nav" aria-label="Quick navigation"><a href="/">الرئيسية</a><a href="/proof">الإثباتات</a><a href="/bot-check">فحص البوت</a><a href="/dashboard">الداشبورد</a></nav>
<main class="box">
  <h1>Choose New Password</h1>
  <p>Use at least 8 characters.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    {{ csrf_field() }}
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="8" required>
    <button type="submit">Update password</button>
  </form>
  <p><a href="/login">Back to login</a></p>
</main>

<script>
window.NEXORA_LANG = "{{ current_lang }}";
</script>
<script src="/static/i18n.js"></script>

</body>
</html>
