<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 10px;
    background: #2c5364;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #203a43;
}

a {
    display: block;
    margin-top: 10px;
    color: #2c5364;
}

.password-wrap {
    position: relative;
}

.toggle-pass {
    position: absolute;
    right: 10px;
    top: 18px;
    background: transparent;
    border: none;
    color: #2c5364;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    width: auto;
    padding: 0;
}
</style>
</head>

<body>

<div class="container">
<h2>Login</h2>

<form method="POST">
<input name="email" type="email" placeholder="Email" required autocomplete="email">

<div class="password-wrap">
    <input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button type="button" class="toggle-pass" onclick="togglePassword()">Show</button>
</div>

<button>Login</button>
</form>

<a href="/register">Create new account</a>
</div>

<script>
function togglePassword() {
    const pass = document.getElementById("password");
    if (pass.type === "password") {
        pass.type = "text";
    } else {
        pass.type = "password";
    }
}
</script>

</body>
</html>
